<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>UMCine 백엔드 연결 확인</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; color: #111; }
        section { border: 1px solid #ddd; border-radius: 12px; padding: 16px 20px; margin-top: 16px; }
        h2 { font-size: 16px; margin: 0 0 12px; }
        input { padding: 8px; width: 220px; }
        button { padding: 8px 12px; margin-left: 4px; }
        .message { margin: 8px 0 0; font-size: 14px; }
        .ok { color: #4f5de8; }
        .fail { color: #e5484d; }
        li { margin-top: 8px; }
    </style>
</head>
<body>
<h1>UMCine 회원 API 확인</h1>

<section>
    <h2>닉네임 중복 확인</h2>
    <input id="nickname" placeholder="예: 수현" />
    <button onclick="checkAvailable('nickname', '닉네임')">확인</button>
    <p id="nickname-message" class="message"></p>
</section>

<section>
    <h2>이메일 중복 확인</h2>
    <input id="email" placeholder="예: noco@umc.com" />
    <button onclick="checkAvailable('email', '이메일')">확인</button>
    <p id="email-message" class="message"></p>
</section>

<section>
    <h2>회원별 평점 조회</h2>
    <input id="member-id" placeholder="회원 번호 예: 1" />
    <button onclick="loadRatings()">조회</button>
    <p id="ratings-message" class="message"></p>
    <ul id="ratings"></ul>
</section>

<script>
    const API_URL = "http://localhost:8080";

    function showMessage(id, text, isOk) {
        const message = document.getElementById(id);
        message.textContent = text;
        message.className = "message " + (isOk ? "ok" : "fail");
    }

    async function checkAvailable(type, label) {
        const value = document.getElementById(type).value.trim();
        if (!value) return;

        try {
            const response = await fetch(`${API_URL}/members/${type}/${encodeURIComponent(value)}`);
            const data = await response.json();
            showMessage(
                `${type}-message`,
                data.available ? `사용할 수 있는 ${label}이에요.` : `이미 사용 중인 ${label}이에요.`,
                data.available,
            );
        } catch {
            showMessage(`${type}-message`, "서버에 연결하지 못했어요.", false);
        }
    }

    async function loadRatings() {
        const memberId = document.getElementById("member-id").value.trim();
        const list = document.getElementById("ratings");
        list.replaceChildren();
        if (!memberId) return;

        try {
            const response = await fetch(`${API_URL}/members/${memberId}/ratings`);
            if (response.status === 404) {
                showMessage("ratings-message", "존재하지 않는 회원이에요.", false);
                return;
            }

            const ratings = await response.json();
            showMessage("ratings-message", `평점 ${ratings.length}개`, true);

            ratings.forEach((rating) => {
                const item = document.createElement("li");
                item.textContent = `영화 ${rating.movieId} | ${"★".repeat(rating.score)} | ${rating.comment ?? "코멘트 없음"} | ${rating.createdAt.replace("T", " ")}`;
                list.append(item);
            });
        } catch {
            showMessage("ratings-message", "서버에 연결하지 못했어요.", false);
        }
    }
</script>
</body>
</html>
