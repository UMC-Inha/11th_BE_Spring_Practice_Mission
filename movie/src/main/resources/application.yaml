spring:
  application:
    name: movie
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
jwt:
  secret: ${JWT_SECRET} # 서명에 쓸 비밀키.
  access-expiration: ${JWT_ACCESS_EXPIRATION} # 토큰 유효시간(초)
