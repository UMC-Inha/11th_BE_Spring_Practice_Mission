<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
</head>
<body>

<h2>닉네임 중복 체크</h2>
GET /members/nickname/{nickname}<br><br>
<input id="nicknameInput" type="text" placeholder="닉네임 입력" />
<button onclick="checkNickname()">확인</button><br>
<div id="nicknameResult"></div>

<br>

<h2>평점 조회</h2>
GET /members/{memberId}/ratings<br><br>
<input id="memberIdInput" type="number" placeholder="memberId 입력" />
<button onclick="getRatings()">조회</button><br>
<div id="ratingsResult"></div>

<script>
  const BASE = 'http://localhost:8080';

  async function checkNickname() {
    const nickname = document.getElementById('nicknameInput').value.trim();
    const el = document.getElementById('nicknameResult');
    if (!nickname) { el.innerText = '닉네임을 입력하세요.'; return; }

    try {
      const res = await fetch(`${BASE}/members/nickname/${encodeURIComponent(nickname)}`);
      const data = await res.json();
      el.innerText = data.available
        ? `"${nickname}" 사용 가능한 닉네임입니다.`
        : `"${nickname}" 이미 사용 중인 닉네임입니다.`;
    } catch (e) {
      el.innerText = '서버 연결 실패. 백엔드가 실행 중인지 확인하세요.';
    }
  }

  async function getRatings() {
    const memberId = document.getElementById('memberIdInput').value.trim();
    const el = document.getElementById('ratingsResult');
    if (!memberId) { el.innerText = 'memberId를 입력하세요.'; return; }

    try {
      const res = await fetch(`${BASE}/members/${memberId}/ratings`);
      if (res.status === 404) { el.innerText = '존재하지 않는 유저입니다.'; return; }
      const data = await res.json();
      el.innerText = data.length === 0
        ? '평점 데이터가 없습니다.'
        : JSON.stringify(data, null, 2);
    } catch (e) {
      el.innerText = '서버 연결 실패. 백엔드가 실행 중인지 확인하세요.';
    }
  }
</script>

</body>
</html>
